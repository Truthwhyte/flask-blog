{% extends 'base.html' %}
{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }} mx-5">{{ message }}</div>
  {% endfor %}
{% endwith %}

<p class="font-bold text-2xl text-white mt-10 ml-6">Welcome to the login page</p>
<div class="flex flex-col justify-between border-2 border-white w-96 max-w-[90vw] p-2 rounded-xl m-auto h-fit mt-6">
    <form method="post" class="w-full bg-blue-100 p-5 rounded-xl">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required class="border-2 border-blue-600 rounded-xl py-2 pl-4 outline-none w-full"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="*******" required class="border-2 border-blue-600 rounded-xl py-2 pl-4 outline-none w-full"><br><br>
        <label><input type="checkbox" name="remember"> Remember me</label><br>
        <button type="submit" class="bg-blue-500 hover:bg-blue-300 hover:text-black cursor-pointer transition duration-700 text-white w-full py-2 rounded-xl mt-6">Log in</button>
    </form>
</div>
<div class="flex justify-center mt-10">
    <p class="font-bold text-white">Not registered?</p>
    <a class="ml-2 hover:underline" href="{{ url_for('register') }}">Register here</a>
</div>

{% endblock %}
